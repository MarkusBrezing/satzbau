<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satzbau</title>
<meta name="theme-color" content="#E6E9EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<style>
/* Schriften liegen im Ordner fonts/ (SIL Open Font License, siehe fonts/OFL.txt) – keine Verbindung zu Google */
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{
  --bg:#E6E9EC; --surface:#FFFFFF; --surface-2:#F1F3F5; --ink:#1B2127; --muted:#5B6570; --line:#CBD1D6;
  --accent:#C42F29; --accent-ink:#FFFFFF; --ok:#2C7A4B; --ok-soft:rgba(44,122,75,.13); --focus:#1E5AA6;
  --a-gruen:#2C7A4B; --a-gelb:#B07A00; --a-rot:#C42F29; --a-neu:#5B6570;
  --p-rot:#C42F29; --p-blau:#1E5AA6; --p-gelb:#DDAA0E; --p-gruen:#2C8A4E; --p-weiss:#B4BCC4; --p-schwarz:#2A2F35;
  --pl-0:#66707A; --pl-1:#3949AB; --pl-2:#B35000; --pl-3:#00796B; --pl-4:#A3266F; --pl-5:#5B6B00; --pl-6:#6D4C41; --pl-ink:#FFFFFF;
  --hatch:rgba(27,33,39,.15); --hatch-on:rgba(255,255,255,.42);
  --num:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --txt:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181C; --surface:#1E242A; --surface-2:#262D34; --ink:#E9EDF1; --muted:#9BA6B1; --line:#353E47;
    --accent:#E2554E; --ok:#4CB27A; --ok-soft:rgba(76,178,122,.16); --focus:#6FA2E6;
    --p-weiss:#D5DBE0; --p-schwarz:#5E6874; color-scheme:dark;
    --pl-0:#9BA6B1; --pl-1:#9FA8DA; --pl-2:#FFB74D; --pl-3:#4DB6AC; --pl-4:#F48FB1; --pl-5:#C5CA62; --pl-6:#BCAAA4; --pl-ink:#14181C; --hatch:rgba(233,237,241,.14); --hatch-on:rgba(20,24,28,.30);
    --a-gruen:#4CB27A; --a-gelb:#E0B83A; --a-rot:#E2554E; --a-neu:#9BA6B1;
  }
}
:root[data-theme="dark"]{
  --bg:#14181C; --surface:#1E242A; --surface-2:#262D34; --ink:#E9EDF1; --muted:#9BA6B1; --line:#353E47;
  --accent:#E2554E; --ok:#4CB27A; --ok-soft:rgba(76,178,122,.16); --focus:#6FA2E6;
  --p-weiss:#D5DBE0; --p-schwarz:#5E6874; color-scheme:dark;
  --pl-0:#9BA6B1; --pl-1:#9FA8DA; --pl-2:#FFB74D; --pl-3:#4DB6AC; --pl-4:#F48FB1; --pl-5:#C5CA62; --pl-6:#BCAAA4; --pl-ink:#14181C; --hatch:rgba(233,237,241,.14); --hatch-on:rgba(20,24,28,.30);
  --a-gruen:#4CB27A; --a-gelb:#E0B83A; --a-rot:#E2554E; --a-neu:#9BA6B1;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:contain}
body{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--txt);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.75rem;padding:.55rem 1rem}
.brand{font:700 1.35rem/1 var(--num);letter-spacing:.01em;margin:0}
.sync{margin-left:auto;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.err{background:var(--accent)} .dot.busy{background:var(--p-gelb)}
main{max-width:46rem;margin:0 auto;padding:1rem 1rem calc(5.5rem + env(safe-area-inset-bottom,0px))}
body.resting main{padding-bottom:calc(10rem + env(safe-area-inset-bottom,0px))}
h2{font:700 1.6rem/1.1 var(--num);margin:1.4rem 0 .6rem}
h3{font:600 1.15rem/1.2 var(--num);margin:1.2rem 0 .4rem}
p{margin:.4rem 0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.55rem .9rem;min-height:2.6rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.wide{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--accent)}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1rem}

/* Startbildschirm */
.next{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--pc,var(--line));border-radius:12px;padding:1.1rem 1rem 1rem;margin-top:.4rem}
.next-label{color:var(--muted);font-size:.9rem}
.next-name{font:700 3rem/0.95 var(--num);margin:.15rem 0 .7rem}
.next ul{list-style:none;margin:0 0 1rem;padding:0}
.next li{display:flex;justify-content:space-between;gap:1rem;padding:.38rem 0 .38rem .7rem;border-left:5px solid var(--plate);margin:.25rem 0}
.next li b{font:600 1.05rem/1.2 var(--num)}
.plans li{display:flex;align-items:center;gap:.6rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.plans li .grow{flex:1;min-width:0}
.plans .pname{font:600 1.25rem/1.1 var(--num)}

/* Aktives Training */
.wbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 3.05rem);z-index:4;background:var(--bg);display:flex;align-items:center;gap:.6rem;padding:.6rem 0}
.wbar .wname{font:700 1.7rem/1 var(--num);flex:1;min-width:0;border:0;background:transparent;padding:0}
.clock{font:600 1.25rem/1 var(--num);color:var(--muted);font-variant-numeric:tabular-nums}
.ex{background:var(--surface);border:1px solid var(--line);border-left:7px solid var(--plate);border-radius:8px;margin:.8rem 0;padding:.75rem .75rem .6rem}
.ex-head{display:flex;align-items:flex-start;gap:.5rem}
.ex-name{font:700 1.3rem/1.1 var(--num);margin:0;flex:1;background:none;border:0;padding:0;text-align:left}
.gear{display:inline-flex;gap:.4rem;align-items:center;margin-top:.35rem;font-size:.85rem;background:var(--surface-2);border:1px dashed var(--line);border-radius:6px;padding:.25rem .5rem;text-align:left}
.gear b{font-family:var(--num);font-size:.95rem}
.hint{font-size:.85rem;color:var(--muted);margin:.45rem 0 .2rem}
.hint.up{color:var(--ok);font-weight:600}
.sets{width:100%;border-collapse:collapse;margin-top:.35rem}
.sets th{font-size:.75rem;font-weight:500;color:var(--muted);text-align:center;padding:.2rem}
.sets td{text-align:center;padding:.22rem .15rem}
.sets tr.done td{background:var(--ok-soft)}
.sets .nr{font:600 1rem/1.1 var(--num);width:3.3rem}
.sets .nr .prev{display:block;font-size:.78rem;margin-top:.1rem}
.sets .prev{font:500 .95rem var(--num);color:var(--muted);white-space:nowrap}
.num-in{width:100%;max-width:5.2rem;text-align:center;font:600 1.45rem/1 var(--num);padding:.35rem .2rem;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.num-in::placeholder{color:var(--muted);opacity:.65}
.tick{width:2.3rem;height:2.4rem;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
tr.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.ex-foot{display:flex;justify-content:space-between;margin-top:.35rem}
.notes{width:100%;margin-top:.4rem;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:.4rem .5rem;font-size:.9rem;resize:vertical}

/* Ampel */
.amp{display:inline-flex;align-items:center;gap:.35rem;font:600 .85rem/1 var(--num);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.22rem .6rem .22rem .45rem;background:var(--surface-2);white-space:nowrap;vertical-align:middle}
.amp::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--c)}
.amp.gruen{--c:var(--a-gruen)} .amp.gelb{--c:var(--a-gelb)} .amp.rot{--c:var(--a-rot)} .amp.neu{--c:var(--a-neu)}
.amps{display:flex;gap:.4rem;flex-wrap:wrap;margin:-.4rem 0 .9rem}
.hint .amp{margin-right:.35rem}

.chip{border-radius:999px;padding:.35rem .85rem;min-height:2.3rem;font:600 .95rem var(--num)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.kern{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:7px solid var(--plate);border-radius:8px;padding:.7rem .8rem .5rem;margin:.6rem 0}
.kern-h{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.kern-n{font:700 1.35rem/1.1 var(--num)}
.kern-s{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.55rem 0 .3rem}
.kern-s b{display:block;font:700 1.5rem/1 var(--num);font-variant-numeric:tabular-nums}
.kern-s span{font-size:.78rem;color:var(--muted)}
.kern svg{display:block;width:100%;height:auto}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:.6rem}

.kgc{display:flex;align-items:center;justify-content:center;gap:2px}
.kgc .num-in{flex:1;min-width:0;width:auto;max-width:4.4rem}
.stp{flex:none;width:1.6rem;height:2.4rem;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font:700 1.25rem/1 var(--num);padding:0;color:var(--ink)}
.stp:active{background:var(--line)}

.lastrow{margin:.45rem 0 .1rem;font:600 1.05rem/1.3 var(--num);font-variant-numeric:tabular-nums}
.lastrow .muted{font-weight:500}

/* Wochen- und Monatsübersicht */
.stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin:.5rem 0}
.pnav{display:flex;align-items:center;gap:.5rem;margin:.4rem 0}
.pnav .lbl{flex:1;text-align:center;font:700 1.2rem var(--num)}
.pnav button{width:2.6rem;height:2.6rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:700 1.4rem/1 var(--num)}
.pnav button:disabled{opacity:.35;cursor:default}
.drow{display:flex;gap:.7rem;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem;margin:.3rem 0}
.drow .dn{font:700 1.1rem/1.1 var(--num);min-width:2.8rem}
.drow .dn small{display:block;font:500 .78rem var(--txt);color:var(--muted)}
.drow.train{border-left:6px solid var(--pc,var(--ok))}
.drow.miss{border-style:dashed;color:var(--muted)}
.drow.rest{background:transparent;border-color:transparent;color:var(--muted);padding:.15rem .7rem;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:.5rem 0}
.cal .h{font:600 .8rem var(--num);color:var(--muted);text-align:center}
.cal .c{min-height:2.5rem;border-radius:6px;border:1px solid var(--line);background-color:var(--surface);font:600 1rem/1.05 var(--num);display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.cal .c.out{visibility:hidden}
.cal .c.train{background-color:var(--pc,var(--ok));border-color:transparent;color:var(--pl-ink)}
.cal .c .ck{font:700 .66rem/1 var(--num);letter-spacing:.02em}
.cal .c.miss{border-style:dashed;color:var(--muted)}
.cal .c.today{outline:2px solid var(--focus);outline-offset:1px}

/* Pausentimer */
#rest{position:fixed;left:0;right:0;bottom:calc(3.9rem + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem}
#rest[hidden]{display:none}
#rest .t{font:700 2.1rem/1 var(--num);font-variant-numeric:tabular-nums;min-width:4.5rem}
#rest .bar{flex:1;height:.55rem;background:rgba(127,127,127,.35);border-radius:3px;overflow:hidden}
#rest .bar i{display:block;height:100%;background:var(--accent);width:100%}
#rest button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:.35rem .55rem;font:600 .95rem var(--num)}

/* Navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:.55rem 0 .6rem;font:600 1rem/1 var(--num);color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}

/* Verlauf */
.month{font:600 1rem var(--num);color:var(--muted);margin:1.2rem 0 .3rem}
.wk{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--pc,var(--line));border-radius:8px;margin:.5rem 0}
.wk>button{display:block;width:100%;text-align:left;background:none;border:0;padding:.75rem}
.wk .d{font:700 1.2rem/1.1 var(--num)}
.wk .meta{font-size:.85rem;color:var(--muted)}
.wk .lines{margin:.4rem 0 0;padding:0;list-style:none;font-size:.92rem}
.wk .lines li{display:flex;justify-content:space-between;gap:.6rem;border-left:4px solid var(--plate);padding-left:.5rem;margin:.18rem 0}
.wk .detail{padding:0 .75rem .75rem}
.pr{color:var(--accent);font-weight:600}

/* Übungen */
.grp{font:600 1.05rem var(--num);margin:1.1rem 0 .2rem;display:flex;align-items:center;gap:.5rem}
.grp::before{content:"";width:1.1rem;height:.55rem;border-radius:2px;background:var(--plate)}
.exl li>button{display:flex;width:100%;justify-content:space-between;gap:.6rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.6rem .7rem;margin:.3rem 0;text-align:left}
.exl .sub{font-size:.8rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.6rem 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem}
.stat b{display:block;font:700 1.6rem/1 var(--num)}
.stat span{font-size:.78rem;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:18rem}
label.f{display:block;font-size:.85rem;color:var(--muted);margin:.6rem 0 .2rem}
.in{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:.5rem .6rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,18,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .s{background:var(--bg);width:100%;max-width:46rem;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
#sheet .s h2{margin-top:.2rem}
.pick li>button{display:flex;width:100%;gap:.6rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--plate);border-radius:6px;padding:.55rem .7rem;margin:.25rem 0;text-align:left}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8.5rem + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:.6rem .9rem;border-radius:8px;font-size:.92rem;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.titem{display:grid;grid-template-columns:1fr auto;gap:.4rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--plate);border-radius:6px;padding:.55rem .6rem;margin:.35rem 0}
.titem .ctl{display:flex;gap:.25rem}
.titem .ctl button{width:2.2rem;height:2.2rem;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.titem .nums{grid-column:1/-1;display:flex;gap:.5rem;align-items:center;font-size:.85rem;color:var(--muted)}
.titem .nums input{width:3.4rem;text-align:center;font:600 1.1rem var(--num);border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:.25rem}
textarea.out{width:100%;min-height:10rem;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:.5rem}
/* Plan-Farben, Phasen, Bearbeiten, Speicher (ab 1.3) */
.pk{display:inline-flex;align-items:center;justify-content:center;min-width:1.7rem;height:1.4rem;padding:0 .3rem;border-radius:4px;background:var(--pc,var(--pl-0));color:var(--pl-ink);font:700 .8rem/1 var(--num);vertical-align:.1rem;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.82rem;color:var(--muted);margin:.25rem 0 .7rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.legend i{display:inline-block;width:.9rem;height:.9rem;border-radius:3px;background-color:var(--pc,transparent);border:1px solid var(--line)}
.swatches{display:flex;gap:.55rem;flex-wrap:wrap;margin:.2rem 0 .3rem}
.swatches button{width:2.5rem;height:2.5rem;border-radius:8px;border:0;background:var(--pc)}
.swatches button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.tag{display:inline-block;font:600 .78rem/1 var(--num);padding:.22rem .45rem;border-radius:4px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);vertical-align:middle;white-space:nowrap}
.tag.erh{background-image:repeating-linear-gradient(135deg,transparent 0 5px,var(--hatch) 5px 7px)}
.phase{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.3rem 0 .5rem;font-size:.9rem;color:var(--muted)}
.phasebox{display:flex;gap:.7rem;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem .75rem;margin:.2rem 0 .6rem}
.phasebox .grow{flex:1;min-width:0}
.hintbox{margin:.8rem 0 .4rem}
.hintbox b{font:600 1.1rem var(--num)}
.zstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin:.6rem 0 .3rem}
.zstrip div{height:1.9rem;border-radius:4px;border:1px solid var(--line);background:var(--surface);font:600 .72rem/1.85rem var(--num);text-align:center;color:var(--muted)}
.zstrip div.e{background-image:repeating-linear-gradient(135deg,transparent 0 5px,var(--hatch) 5px 7px);color:var(--ink)}
.zstrip div.now{outline:2px solid var(--focus);outline-offset:1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.3rem .9rem;margin:0;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.num-in.bad,.in.bad{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

<script>
'use strict';
/* ---------- Gerätekatalog (McFit-Ausstattung: überwiegend gym80-Maschinen, Kabeltürme, Freihantel) ---------- */
const CATALOG = [
  ['beinpresse','Beinpresse','Beine','maschine',['leg press','leg press machine']],
  ['beinstrecker','Beinstrecker','Beine','maschine',['leg extension']],
  ['beinbeuger_liegend','Beinbeuger liegend','Beine','maschine',['lying leg curl','leg curl lying']],
  ['beinbeuger_sitzend','Beinbeuger sitzend','Beine','maschine',['seated leg curl','leg curl']],
  ['hackenschmidt','Hackenschmidt','Beine','maschine',['hack squat']],
  ['kniebeuge_multipresse','Kniebeuge Multipresse','Beine','maschine',['smith machine squat','squat smith machine']],
  ['abduktor','Abduktor','Beine','maschine',['hip abduction','abductor']],
  ['adduktor','Adduktor','Beine','maschine',['hip adduction','adductor']],
  ['multihuefte','Multihüfte','Beine','maschine',['multi hip','glute kickback']],
  ['wade','Wadenmaschine','Beine','maschine',['calf raise','seated calf raise','standing calf raise']],
  ['brustpresse','Brustpresse','Brust','maschine',['chest press','chest press machine']],
  ['bankdruecken','Bankdrücken breit','Brust','frei',['bench press wide','bench press','bench press wide grip']],
  ['schraegbank','Schrägbankdrücken','Brust','frei',['a12 schraegbank','a12 schragbank','incline bench press','incline press','schraegbank']],
  ['butterfly','Butterfly','Brust','maschine',['chest fly','pec deck','butterfly']],
  ['dips','Dip-Maschine','Brust','maschine',['dip','dips','seated dip']],
  ['latzug_breit','Latzug breit','Rücken','kabel',['lat pulldown wide grip','lat pulldown wide','lat pulldown']],
  ['latzug_eng','Latzug eng','Rücken','kabel',['lat pulldown close grip','close grip lat pulldown']],
  ['rudern','Rudermaschine','Rücken','maschine',['seated row','row machine','seated cable row']],
  ['tbar','T-Bar-Rudern','Rücken','maschine',['t bar row','tbar row']],
  ['pullover','Pullover-Maschine','Rücken','maschine',['pullover','pullover machine']],
  ['rueckenstrecker','Rückenstrecker','Rücken','maschine',['back extension','lower back']],
  ['klimmzug','Klimmzug assistiert','Rücken','maschine',['assisted pull up','pull up assisted','assisted chin up']],
  ['schulterpresse','Schulterpresse','Schultern','maschine',['shoulder press','overhead press machine']],
  ['seitheben_maschine','Seitheber-Maschine','Schultern','maschine',['lateral raise machine']],
  ['seitheben_kh','Seitheben Kurzhantel','Schultern','frei',['lateral raise','dumbbell lateral raise']],
  ['reverse_butterfly','Reverse Butterfly','Schultern','maschine',['reverse fly','rear delt fly','reverse pec deck']],
  ['bizeps_kh','Bizepscurl Kurzhantel','Arme','frei',['bicep curl','biceps curl','dumbbell curl']],
  ['bizeps_maschine','Bizeps-Maschine','Arme','maschine',['bicep curl machine','preacher curl machine']],
  ['bizeps_kabel','Bizepscurl Kabel','Arme','kabel',['cable curl','bicep curl cable']],
  ['trizeps_kabel','Trizepsdrücken Kabel','Arme','kabel',['triceps pushdown','tricep pushdown','triceps pushdown rope']],
  ['trizeps_maschine','Trizeps-Maschine','Arme','maschine',['triceps extension machine','tricep dip machine']],
  ['bauchmaschine','Bauchmaschine','Bauch','maschine',['ab crunch machine','crunch machine']],
  ['rotation','Rotationsmaschine','Bauch','maschine',['torso rotation']],
];
const GROUPS = ['Beine','Brust','Rücken','Schultern','Arme','Bauch','Sonstige'];
const PLATE = {Beine:'var(--p-rot)','Rücken':'var(--p-blau)',Brust:'var(--p-gelb)',Schultern:'var(--p-gruen)',Arme:'var(--p-weiss)',Bauch:'var(--p-schwarz)',Sonstige:'var(--muted)'};
const TYP = {maschine:'Maschine',kabel:'Kabelzug',frei:'Freihantel'};
const DEF_STEP = {maschine:2.5,kabel:2.5,frei:2};
const CAT = {};
CATALOG.forEach(([id,name,group,typ,aliases])=>{CAT[id]={id,name,group,typ,aliases}});

/* ---------- Hilfen ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o=>JSON.parse(JSON.stringify(o));
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
const nf = new Intl.NumberFormat('de-DE',{maximumFractionDigits:2});
const fmt = n=>n==null||isNaN(n)?'–':nf.format(n);
function parseNum(v){ if(v==null) return null; let t=String(v).trim().replace(/\s/g,''); if(t==='') return null;
  if(t.includes(',')){ if((t.match(/,/g)||[]).length>1) return null; t=t.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'); }
  if(!/^-?\d*\.?\d+$|^-?\d+\.$/.test(t)) return null; const n=Number(t); return isFinite(n)?n:null; }
const norm = s=>String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim();
const newId = ()=>'w-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
const e1rm = (kg,reps)=>reps>0&&kg>0?kg*(1+Math.min(reps,15)/30):0;
const dayFmt = new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
const monFmt = new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'});
const dateFmt = new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'});
function dur(ms){ const m=Math.round(ms/60000); return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`; }
function clock(ms){ const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); }

/* ---------- Zustand und Speicher ----------
   Ab 1.4 ist die Browser-Datenbank IndexedDB „satzbau“ der Hauptspeicher (Bereiche meta, workouts, zustand).
   localStorage „kraftbuch.v1“ wird als Spiegelkopie mitgeschrieben (soweit Platz) und ist der Rückfall,
   wenn IndexedDB fehlt. Der Stand vor dem Umzug bleibt unter „kraftbuch.v1.vor-1.4“ erhalten. */
const APP_VERSION='1.5';
const LS='kraftbuch.v1', LS_ALT='kraftbuch.v1.vor-1.4', LS_MIG='satzbau.umzug';
let S={meta:{kind:'meta',templates:[],exercises:{},restSec:90,restTyp:{},body:[],kern:[],kernSet:false,planTage:[1,3,5],zyklus:{aktiv:false,start:null,wiederholen:true,phasen:[],anker:[]}},workouts:{},active:null,pending:{},deleted:{},metaDirty:false,lastBackup:null,snooze:{}};
let view={tab:'training',sub:null};
const clampN=(v,lo,hi,d)=>{ if(v==null||v==='') return d; v=+v; return isFinite(v)?Math.min(hi,Math.max(lo,v)):d; };
const rid=()=>Math.random().toString(36).slice(2,8);
const isDay=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
function normZyklus(z){
  z=z&&typeof z==='object'?z:{};
  const phasen=(Array.isArray(z.phasen)?z.phasen:[]).filter(p=>p&&(p.typ==='aufbau'||p.typ==='erholung')).map(p=>{ const e=p.typ==='erholung';
    return {id:typeof p.id==='string'?p.id:rid(),name:String(p.name||(e?'Erholung':'Aufbau')).slice(0,30),typ:p.typ,wochen:Math.round(clampN(p.wochen,1,12,e?1:4)),
      gewichtFaktor:e?clampN(p.gewichtFaktor,0.3,1,0.7):1,saetzeFaktor:e?clampN(p.saetzeFaktor,0.2,1,0.5):1}; });
  const anker=(Array.isArray(z.anker)?z.anker:[]).filter(a=>a&&isDay(a.ab)&&Number.isInteger(a.phase)&&a.phase>=0).map(a=>({ab:a.ab,phase:a.phase})).sort((a,b)=>a.ab<b.ab?-1:a.ab>b.ab?1:0);
  const start=isDay(z.start)?z.start:null;
  return {aktiv:!!z.aktiv&&phasen.length>0&&!!start,start,wiederholen:z.wiederholen!==false,phasen,anker};
}
function normMeta(m){ m=m||{}; return {kind:'meta',templates:Array.isArray(m.templates)?m.templates.filter(t=>t&&t.id).map(t=>Object.assign(t,{items:Array.isArray(t.items)?t.items:[]})):[],exercises:m.exercises&&typeof m.exercises==='object'?m.exercises:{},restSec:+m.restSec||90,restTyp:m.restTyp&&typeof m.restTyp==='object'?m.restTyp:{},kern:Array.isArray(m.kern)?m.kern.filter(x=>typeof x==='string').slice(0,3):[],kernSet:!!m.kernSet,body:Array.isArray(m.body)?m.body.filter(b=>b&&/^\d{4}-\d{2}-\d{2}$/.test(b.d)&&b.kg>0).map(b=>({d:b.d,kg:+b.kg})):[],
  planTage:Array.isArray(m.planTage)?[...new Set(m.planTage.map(Number).filter(d=>Number.isInteger(d)&&d>=0&&d<=6))].sort((a,b)=>a-b):[1,3,5],zyklus:normZyklus(m.zyklus)}; }
function applyState(j){ j=j||{}; S.meta=normMeta(j.meta); S.workouts=j.workouts&&typeof j.workouts==='object'&&!Array.isArray(j.workouts)?j.workouts:{}; S.active=j.active||null; S.pending=j.pending||{}; S.deleted=j.deleted||{}; S.metaDirty=!!j.metaDirty; S.lastBackup=+j.lastBackup||null; S.snooze=j.snooze&&typeof j.snooze==='object'?j.snooze:{}; }
function stateJSON(at){ return {meta:S.meta,workouts:S.workouts,active:S.active,pending:S.pending,deleted:S.deleted,metaDirty:S.metaDirty,lastBackup:S.lastBackup,snooze:S.snooze,savedAt:at||Date.now()}; }
function mergeStates(a,b){ return {meta:b.meta||a.meta,workouts:Object.assign({},a.workouts,b.workouts),active:b.active||null,pending:Object.assign({},a.pending,b.pending),deleted:Object.assign({},a.deleted,b.deleted),metaDirty:!!(a.metaDirty||b.metaDirty),lastBackup:Math.max(+a.lastBackup||0,+b.lastBackup||0)||null,snooze:Object.assign({},a.snooze,b.snooze)}; }

let DB=null, store='ls', booted=false, mirrorOk=true, migrated=false, needSave=false, saveErr=null, lsOk=true, stamp=0;
const DB_STORES=['meta','workouts','zustand'], savedW=new Map();
let saving=false, saveAgain=false, lsT=null;
function idbOpen(){ return new Promise((res,rej)=>{
  if(!window.indexedDB) return rej(new Error('IndexedDB nicht verfügbar'));
  let fertig=false; const to=setTimeout(()=>{ if(!fertig){ fertig=true; rej(new Error('IndexedDB antwortet nicht')); } },4000);
  let rq; try{ rq=indexedDB.open('satzbau',1); }catch(e){ clearTimeout(to); return rej(e); }
  rq.onupgradeneeded=()=>{ const db=rq.result; if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta'); if(!db.objectStoreNames.contains('workouts')) db.createObjectStore('workouts',{keyPath:'id'}); if(!db.objectStoreNames.contains('zustand')) db.createObjectStore('zustand'); };
  rq.onsuccess=()=>{ clearTimeout(to); const db=rq.result; if(fertig){ try{ db.close(); }catch(e){} return; } fertig=true; db.onversionchange=()=>{ try{ db.close(); }catch(e){} DB=null; }; res(db); };
  rq.onerror=()=>{ clearTimeout(to); if(!fertig){ fertig=true; rej(rq.error||new Error('IndexedDB-Fehler')); } };
}); }
const idbGet=r=>new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const idbDone=tx=>new Promise((res,rej)=>{ tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error('Schreiben abgebrochen')); });
async function idbWrite(){
  if(saving){ saveAgain=true; return; } saving=true;
  try{ do{ saveAgain=false;
      const tx=DB.transaction(DB_STORES,'readwrite'), os=tx.objectStore('workouts'), jetzt=new Map(), z=stateJSON(stamp);
      tx.objectStore('meta').put(S.meta,'meta');
      delete z.meta; delete z.workouts; tx.objectStore('zustand').put(z,'zustand');
      for(const id in S.workouts){ const j=JSON.stringify(S.workouts[id]); jetzt.set(id,j); if(savedW.get(id)!==j) os.put(JSON.parse(j)); }
      for(const id of savedW.keys()) if(!jetzt.has(id)) os.delete(id);
      await idbDone(tx); savedW.clear(); jetzt.forEach((v,k)=>savedW.set(k,v)); saveErr=null;
    }while(saveAgain);
  }catch(e){ saveErr=e; toast('Speichern in der Datenbank fehlgeschlagen – Daten unter „Daten“ sichern'); }
  finally{ saving=false; }
}
function lsWrite(){ if(store==='idb'&&!mirrorOk) return; try{ localStorage.setItem(LS,JSON.stringify(stateJSON(stamp))); }catch(e){ if(store==='idb') mirrorOk=false; else saveErr=e; } }
function saveLocalNow(){ if(!booted) return; clearTimeout(lsT); lsT=null; stamp=Date.now(); if(store==='idb'&&DB) idbWrite(); lsWrite(); }
function saveLocal(){ if(!booted) return; clearTimeout(lsT); lsT=setTimeout(saveLocalNow,300); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&lsT) saveLocalNow(); });
window.addEventListener('pagehide',()=>{ if(lsT) saveLocalNow(); });
async function loadState(){
  let ls=null; try{ ls=JSON.parse(localStorage.getItem(LS)||'null'); if(!ls||typeof ls!=='object') ls=null; }catch(e){ ls=null; }
  try{
    DB=await idbOpen();
    const tx=DB.transaction(DB_STORES,'readonly');
    const [m,ws,z]=await Promise.all([idbGet(tx.objectStore('meta').get('meta')),idbGet(tx.objectStore('workouts').getAll()),idbGet(tx.objectStore('zustand').get('zustand'))]);
    store='idb'; (ws||[]).forEach(w=>savedW.set(w.id,JSON.stringify(w)));
    const ausDb=m?Object.assign({},z||{},{meta:m,workouts:Object.fromEntries((ws||[]).map(w=>[w.id,w]))}):null;
    if(ausDb&&!(ls&&(+ls.savedAt||0)>(+ausDb.savedAt||0))){ applyState(ausDb); return; }
    if(ls&&!ausDb){ migrated=true; needSave=true; try{ if(localStorage.getItem(LS_ALT)==null) localStorage.setItem(LS_ALT,localStorage.getItem(LS)); localStorage.setItem(LS_MIG,new Date().toISOString()); }catch(e){} applyState(ls); return; }
    if(ls&&ausDb){ needSave=true; applyState(mergeStates(ausDb,ls)); }
  }catch(e){ DB=null; store=lsOk?'ls':'none'; if(ls) applyState(ls); }
}
async function wipeAll(){ booted=false; clearTimeout(lsT);
  try{ if(DB){ const tx=DB.transaction(DB_STORES,'readwrite'); DB_STORES.forEach(n=>tx.objectStore(n).clear()); await idbDone(tx); } }catch(e){}
  [LS,LS_ALT,LS_MIG].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} }); }

function getEx(id){
  const o=S.meta.exercises[id]||{}; const c=CAT[id]||{id,name:o.name||id,group:'Sonstige',typ:'maschine',aliases:[]};
  const typ=o.typ||c.typ;
  return {id,name:o.name||c.name,group:GROUPS.includes(o.group)?o.group:c.group,typ,aliases:c.aliases||[],custom:!CAT[id],hidden:!!o.hidden,notiz:o.notiz||'',
    geraetNr:o.geraetNr||'',einstellung:o.einstellung||'',schritt:o.schritt!=null?+o.schritt:DEF_STEP[typ]||2.5,
    repMin:o.repMin!=null?+o.repMin:8,repMax:o.repMax!=null?+o.repMax:12,pause:(o.pause!=null&&o.pause!=='')?+o.pause:null};
}
function allExIds(){ const ids=new Set(Object.keys(CAT)); Object.keys(S.meta.exercises).forEach(k=>{ if(S.meta.exercises[k]&&S.meta.exercises[k].name||CAT[k]) ids.add(k); }); return [...ids]; }
function visibleExIds(){ return allExIds().filter(id=>!(S.meta.exercises[id]&&S.meta.exercises[id].hidden)); }
function exUsage(id){ const trainings=Object.values(S.workouts).filter(w=>w&&Array.isArray(w.exercises)&&w.exercises.some(b=>b.ex===id)).length;
  return {trainings,plans:S.meta.templates.filter(t=>t.items.some(it=>it.ex===id)).map(t=>t.name),active:!!(S.active&&S.active.exercises.some(b=>b.ex===id))}; }
function setExMeta(id,patch){ S.meta.exercises[id]=Object.assign({},S.meta.exercises[id],patch); metaChanged(); }
let metaT; function metaChanged(){ S.metaDirty=true; saveLocal(); clearTimeout(metaT); metaT=setTimeout(push,900); }
function finished(){ return Object.values(S.workouts).filter(w=>w&&w.end).sort((a,b)=>b.start-a.start); }

/* ---------- Verlauf je Übung ---------- */
const isErh=w=>!!(w&&w.phase&&w.phase.typ==='erholung');
function sessionsFor(ex,before,ohneErh){ const out=[]; for(const w of finished()){ if(before&&w.start>=before) continue; if(ohneErh&&isErh(w)) continue; for(const b of w.exercises){ if(b.ex===ex){ const sets=b.sets.filter(s=>s.done!==false&&s.reps>0&&!s.warm&&!(s.kg>PLAUS.kgMax)&&!(s.reps>PLAUS.repsMax)); if(sets.length) out.push({w,sets}); } } } return out; }
function lastSession(ex){ return sessionsFor(ex,null,true)[0]||sessionsFor(ex)[0]||null; }
const roundStep=(v,st)=>{ st=st>0?st:2.5; return Math.max(0,+(Math.round(v/st)*st).toFixed(2)); };
const pct=f=>Math.round((f||0)*100)+' %';
function suggest(ex,repMax,ph){
  const last=lastSession(ex); if(!last) return {kg:null,text:'Erstes Mal – Startgewicht wählen.'};
  const top=Math.max(...last.sets.map(s=>s.kg||0)); const atTop=last.sets.filter(s=>(s.kg||0)===top); const step=getEx(ex).schritt;
  if(ph&&ph.typ==='erholung'){ const f=ph.gewichtFaktor||0.7, kg=roundStep(top*f,step); return {kg,erh:true,text:`Erholung: ${fmt(kg)} kg statt ${fmt(top)} kg (${pct(f)})`}; }
  if(atTop.every(s=>s.reps>=repMax)) return {kg:+(top+step).toFixed(2),up:true,text:`Zuletzt ${fmt(top)} kg, alle Sätze ≥ ${repMax} Wdh. → heute ${fmt(top+step)} kg`};
  return {kg:top||null,text:`${fmt(top)} kg halten, Ziel ${repMax} Wdh. in allen Sätzen (zuletzt ${atTop.map(s=>s.reps).join('/')})`};
}
function bests(ex,before){ let kg=0,e=0,vol=0; for(const {sets} of sessionsFor(ex,before,true)){ let v=0; for(const s of sets){ kg=Math.max(kg,s.kg||0); e=Math.max(e,e1rm(s.kg,s.reps)); v+=(s.kg||0)*s.reps; } vol=Math.max(vol,v); } return {kg,e,vol}; }
/* ---------- Plausibilität ----------
   hart: unmöglich → abgelehnt; weich: ungewöhnlich → Rückfrage, nach Bestätigung s.ok=true */
const PLAUS={kgMax:500,repsMax:100,repsWarn:30,up:1.5,upSteps:4,down:0.5,typMax:{maschine:250,kabel:120,frei:150}};
const median=a=>{ const x=a.slice().sort((p,q)=>p-q), m=x.length>>1; return x.length?(x.length%2?x[m]:(x[m-1]+x[m])/2):null; };
function refKg(b,si,ctx){
  for(let i=si-1;i>=0;i--){ const t=b.sets[i]; if(t.done&&t.kg>0&&!t.warm) return {kg:t.kg,src:'Satz davor'}; }
  const tops=sessionsFor(b.ex,ctx&&ctx.before,true).slice(0,3).map(({sets})=>Math.max(...sets.map(s=>s.kg||0))).filter(k=>k>0);
  if(!tops.length) return null; const ph=ctx&&ctx.phase;
  if(ph&&ph.typ==='erholung') return {kg:roundStep(median(tops)*(ph.gewichtFaktor||0.7),getEx(b.ex).schritt),src:'Erholungsziel'};
  return {kg:median(tops),src:tops.length>1?'letzte Trainings':'letztes Training'}; }
function plausRange(ex,ref){ const st=getEx(ex).schritt||2.5; return {lo:ref*PLAUS.down,hi:Math.max(ref*PLAUS.up,ref+PLAUS.upSteps*st)}; }
function checkSet(b,si,raw,prevRaw,ctx){
  const s=b.sets[si], e=getEx(b.ex), out=[]; let hard=false;
  if(s.kg!=null){
    if(s.kg<0||s.kg>PLAUS.kgMax){ hard=true; out.push(`${fmt(s.kg)} kg ist nicht möglich (0–${PLAUS.kgMax} kg).`); }
    else if(!s.ok&&!s.warm){ const r=refKg(b,si,ctx);
      if(r&&r.kg>=5){ const g=plausRange(b.ex,r.kg); if(s.kg>g.hi||s.kg<g.lo) out.push(`${fmt(s.kg)} kg ist ungewöhnlich: ${r.src} ${fmt(r.kg)} kg, erwartet ${fmt(Math.round(g.lo*2)/2)}–${fmt(Math.round(g.hi*2)/2)} kg.`); }
      else if(!r&&s.kg>(PLAUS.typMax[e.typ]||250)) out.push(`${fmt(s.kg)} kg ist für ${TYP[e.typ]||'diese Übung'} sehr viel.`); }
    if(out.length&&!hard){ const a=String(raw??fmt(s.kg)), pv=String(prevRaw??''); const r=refKg(b,si,ctx);
      if(pv&&a!==pv&&a.includes(pv)) out.push(`Vermutlich vor oder hinter „${pv}“ weitergetippt.`);
      else if(r&&a.includes(fmt(r.kg))&&a!==fmt(r.kg)) out.push(`Enthält „${fmt(r.kg)}“ – Tippfehler?`); } }
  if(s.reps!=null){
    if(s.reps<0||s.reps>PLAUS.repsMax){ hard=true; out.push(`${s.reps} Wiederholungen sind nicht möglich (0–${PLAUS.repsMax}).`); }
    else if(!s.okR&&s.reps>PLAUS.repsWarn) out.push(`${s.reps} Wiederholungen sind ungewöhnlich viele.`); }
  return {ok:!out.length,hard,msg:out}; }
const ctxOf=w=>w?{before:w.start,phase:w.phase||null}:null;
function askPlaus(title,msg){ return new Promise(res=>{ openSheet(`<h2>${esc(title)}</h2>${msg.map(m=>`<p>${esc(m)}</p>`).join('')}<div class="row" style="margin-top:1rem"><button class="btn primary" data-a="ask" data-v="0">Korrigieren</button><button class="btn" data-a="ask" data-v="1">Stimmt so</button></div>`,{ask:res}); }); }
function focusSet(bi,si,f){ const inp=document.querySelector(`input[data-f="${f||'kg'}"][data-b="${bi}"][data-s="${si}"]`); if(inp){ inp.focus(); inp.select(); } }
function badSets(){ let n=0; for(const w of Object.values(S.workouts)) for(const b of (w&&w.exercises)||[]) for(const x of b.sets||[]) if(x.kg>PLAUS.kgMax||x.kg<0||x.reps>PLAUS.repsMax) n++; return n; }
function nextTemplate(){ const t=S.meta.templates.filter(x=>x.items&&x.items.length); if(!t.length) return null; const last=finished().find(w=>w.templateId&&t.some(x=>x.id===w.templateId)); if(!last) return t[0]; const i=t.findIndex(x=>x.id===last.templateId); return t[(i+1)%t.length]; }

const pad2=n=>String(n).padStart(2,'0');
const todayStr=()=>{ const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const dStr=s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).getTime(); };
const fd=v=>(v>0?'+':v<0?'−':'±')+fmt(Math.abs(v));
function bodyList(){ return (S.meta.body||[]).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0); }
function setBody(d,kg,silent){ S.meta.body=(S.meta.body||[]).filter(x=>x.d!==d); S.meta.body.push({d,kg}); if(!silent) metaChanged(); }
function delBody(d){ S.meta.body=(S.meta.body||[]).filter(x=>x.d!==d); metaChanged(); }
function bodyTrend(){ const l=bodyList(); if(!l.length) return null; const last=l[l.length-1], prev=l.length>1?l[l.length-2]:null; const ref=l.filter(x=>dStr(x.d)<=dStr(last.d)-28*864e5).pop(); const r=v=>Math.round(v*10)/10;
  return {last,dPrev:prev?r(last.kg-prev.kg):null,d28:ref?r(last.kg-ref.kg):null}; }
function bodyChart(){
  const l=bodyList().slice(-90); if(l.length<2) return '';
  const W=600,H=200,L=44,R=10,T=14,B=26; const ts=l.map(x=>dStr(x.d)), t0=ts[0], t1=ts[ts.length-1]; const vs=l.map(x=>x.kg);
  const lo=Math.floor(Math.min(...vs)-0.5), hi=Math.ceil(Math.max(...vs)+0.5);
  const x=i=>L+(ts[i]-t0)*(W-L-R)/((t1-t0)||1), y=v=>T+(hi-v)*(H-T-B)/((hi-lo)||1);

    ${[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(v)}</text>`).join('')}
    <path d="${l.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.kg).toFixed(1)}`).join('')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    ${l.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="3.5" fill="var(--accent)"/>`).join('')}

  </svg></div>`;
}
function vBody(){

/* ---------- Progressionsampel ---------- */
const AMPEL={up:0.01,drop:-0.05};
const AMP_TXT={gruen:'Auf Kurs',gelb:'Stagniert',rot:'Hinter Plan',neu:'Neu'};
function ampel(ex){
  const ss=sessionsFor(ex,null,true).slice(0,6).reverse().map(({w,sets})=>{ let e=0,kg=0; for(const s of sets){ e=Math.max(e,e1rm(s.kg,s.reps)); kg=Math.max(kg,s.kg||0); } return {t:w.start,e,kg}; });
  if(ss.length<2) return {c:'neu',text:ss.length?'Ab dem zweiten Training zeigt die Ampel den Stand.':'Noch nicht trainiert.'};
  const prog=i=>ss[i].kg>ss[i-1].kg||ss[i].e>=ss[i-1].e*(1+AMPEL.up);
  const last=ss.length-1, d=ss[last].e/ss[last-1].e-1, pct=Math.round(Math.abs(d)*100);
  if(prog(last)) return {c:'gruen',text:'Letztes Training besser als das davor.'};
  let miss=0; for(let i=last;i>=1&&!prog(i);i--) miss++;
  if(d<=AMPEL.drop) return {c:'rot',text:`Leistung ${pct} % gefallen. Erholung prüfen oder Gewicht senken.`};
  if(miss>=2) return {c:'rot',text:`Seit ${miss} Trainings kein Fortschritt. Gewicht um etwa 10 % senken und Wiederholungen neu aufbauen.`};
  return {c:'gelb',text:'Letztes Training ohne Fortschritt. Nächstes Mal mehr Wiederholungen oder Gewicht.'};
}
const ampPill=a=>`<span class="amp ${a.c}">${AMP_TXT[a.c]}</span>`;
function planAmpel(t){ const n={gruen:0,gelb:0,rot:0,neu:0}; t.items.forEach(it=>n[ampel(it.ex).c]++); return ['gruen','gelb','rot','neu'].filter(k=>n[k]).map(k=>`<span class="amp ${k}">${n[k]} ${AMP_TXT[k].toLowerCase()}</span>`).join(''); }

/* ---------- Cloud (Datenbank des Artefakts) ---------- */
let COL=null, pushing=false, again=false, importing=false;
function setSync(state,text){ const el=$('#sync'); el.innerHTML=`<span class="dot ${state}"></span><span>${esc(text)}</span>`; }
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function'){ setSync('','Nur auf diesem Gerät'); return; }
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){ setSync('','Nur auf diesem Gerät'); return; }
    const uid=await user.id(); if(!uid){ setSync('','Nur auf diesem Gerät'); return; }
    COL=db.collection('data/users/'+uid);
    await pull();
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&COL) pull().catch(()=>{}); });
  }catch(e){ setSync('err','Sync-Fehler – Daten bleiben lokal'); }
}
async function call(fn){ for(let i=0;i<5;i++){ try{ return await fn(); }catch(e){ const c=e&&e.code; if(c==='unavailable'||c==='resource_exhausted'){ await sleep(500*(i+1)+Math.random()*400); continue; } throw e; } } throw {code:'unavailable',message:'Server nicht erreichbar'}; }
async function pull(){
  setSync('busy','Synchronisiere …');
  const snap=await call(()=>COL.limit(1000).get());
  let rMeta=null; const rW={};
  snap.docs.forEach(d=>{ const v=d.data(); if(!v) return; if(d.id==='meta') rMeta=v; else if(v.kind==='workout') rW[d.id]=clone(v); });
  if(rMeta&&!S.metaDirty){ S.meta=normMeta(clone(rMeta)); ensurePlanColors(); }
  for(const id in rW){ if(!S.pending[id]&&!S.deleted[id]) S.workouts[id]=rW[id]; }
  for(const id in S.workouts){ if(!rW[id]&&!S.pending[id]) delete S.workouts[id]; }
  saveLocalNow(); render();
  await push();
}
async function push(){
  if(!COL){ saveLocal(); return; }
  if(pushing){ again=true; return; } pushing=true;
  try{
    const todo=Object.keys(S.pending).length+Object.keys(S.deleted).length+(S.metaDirty?1:0);
    let n=0; if(todo) setSync('busy',`Speichere … 0/${todo}`);
    for(const id of Object.keys(S.deleted)){ await call(()=>COL.doc(id).delete()); delete S.deleted[id]; n++; }
    if(S.metaDirty){ S.metaDirty=false; const m=clone(S.meta); try{ await call(()=>COL.doc('meta').set(m)); }catch(e){ S.metaDirty=true; throw e; } n++; }
    for(const id of Object.keys(S.pending)){ const w=S.workouts[id]; if(w) await call(()=>COL.doc(id).set(clone(w))); delete S.pending[id]; n++; if(importing){ setSync('busy',`Speichere … ${n}/${todo}`); await sleep(120); } }
    saveLocalNow(); setSync('ok','Gespeichert');
  }catch(e){
    saveLocalNow();
    const c=e&&e.code;
    setSync('err', c==='quota_exceeded'?'Speicher voll – lokal gesichert':c==='invalid_argument'?'Speichern abgelehnt – lokal gesichert':'Offline – wird nachgeholt');
  }finally{ pushing=false; if(again){ again=false; push(); } }
}
window.addEventListener('online',()=>push());

function startWorkout(tplId){

}
function newBlock(ex,sets,repMin,repMax,ph,keepCount){
  const e=getEx(ex); const rmin=repMin!=null?+repMin:e.repMin, rmax=repMax!=null?+repMax:e.repMax; const sg=suggest(ex,rmax,ph);
  let n=Math.max(1,+sets||3); if(!keepCount&&ph&&ph.typ==='erholung') n=Math.max(1,Math.ceil(n*(ph.saetzeFaktor||0.5)));

}

const rest={end:0,total:0,t:null};

function computePrs(w){ if(isErh(w)) return []; const prs=[];
  for(const b of w.exercises){ const old=bests(b.ex,w.start); let mkg=0,me=0; const g=old.kg?plausRange(b.ex,old.kg):null;
    b.sets.forEach(s=>{ if(s.warm||s.kg>PLAUS.kgMax||(g&&!s.ok&&s.kg>g.hi)) return; mkg=Math.max(mkg,s.kg||0); me=Math.max(me,e1rm(s.kg,s.reps)); });
    if(old.kg&&mkg>old.kg) prs.push(`${getEx(b.ex).name}: ${fmt(mkg)} kg (vorher ${fmt(old.kg)})`);
    else if(old.e&&me>old.e+0.05) prs.push(`${getEx(b.ex).name}: geschätztes 1RM ${fmt(Math.round(me*10)/10)} kg`); }
  return prs; }
function recomputePrs(){ for(const w of finished().slice().reverse()){ const p=computePrs(w); if(JSON.stringify(p)!==JSON.stringify(w.prs||[])){ w.prs=p; S.pending[w.id]=true; } } }
function finishWorkout(force){
  if(!force){ const issues=[]; let hard=null; S.active.exercises.forEach((b,bi)=>b.sets.forEach((s,si)=>{ if(s.done){ const c=checkSet(b,si,undefined,undefined,ctxOf(S.active)); if(c.hard&&!hard) hard={bi,si,m:`${getEx(b.ex).name}, Satz ${si+1}: ${c.msg[0]}`}; else if(!c.ok) issues.push(`${getEx(b.ex).name}, Satz ${si+1}: ${c.msg[0]}`); } }));
    if(hard){ toast(hard.m); focusSet(hard.bi,hard.si); return; }
    if(issues.length){ askPlaus('Vor dem Speichern prüfen',issues).then(ok=>{ closeSheet(); if(ok){ S.active.exercises.forEach(b=>b.sets.forEach(s=>{ if(s.done) s.ok=s.okR=true; })); finishWorkout(true); } }); return; } }
  const kept=S.active.exercises.map(b=>Object.assign({},b,{sets:b.sets.filter(s=>s.done)})).filter(b=>b.sets.length);
  if(!kept.length){ ask('Kein Satz abgehakt. Training verwerfen?','Verwerfen',true).then(ok=>{ closeSheet(); if(ok){ S.active=null; saveLocalNow(); stopRest(); render(); } }); return; }
  const w=S.active; w.exercises=kept; w.end=Date.now(); const prs=computePrs(w);
  w.prs=prs;
  S.workouts[w.id]=w; S.pending[w.id]=true; S.active=null; stopRest(); saveLocalNow(); push();
  const sets=w.exercises.reduce((n,b)=>n+b.sets.length,0), vol=w.exercises.reduce((n,b)=>n+b.sets.reduce((m,s)=>m+(s.kg||0)*s.reps,0),0);

function parseCSV(text){
  text=text.replace(/^\uFEFF/,''); const first=text.split(/\r?\n/,1)[0]; const d=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[]; let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===d){ row.push(f); f=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; } else f+=c; }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); }
function mapExercise(name){
  const n=norm(name);
  for(const id of allExIds()){ const e=getEx(id); if(norm(e.name)===n||e.aliases.some(a=>norm(a)===n)) return id; }
  const id='c-'+(n.replace(/ /g,'-').slice(0,40)||hash(name));
  if(!S.meta.exercises[id]||!S.meta.exercises[id].name){ const l=name.toLowerCase(); const typ=/dumbbell|barbell|kurzhantel|langhantel/.test(l)?'frei':/cable|kabel/.test(l)?'kabel':'maschine';
    S.meta.exercises[id]=Object.assign({},S.meta.exercises[id],{name:name.replace(/\s+/g,' ').trim(),group:'Sonstige',typ}); S.metaDirty=true; }
  return id;
}
function parseDate(s){ const m=String(s).match(/(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/); if(m) return new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)).getTime(); const t=Date.parse(s); return isNaN(t)?null:t; }

function importStrong(text){
  const rows=parseCSV(text); if(rows.length<2) throw new Error('Die Datei enthält keine Daten.');
  const H=rows[0].map(h=>h.trim().toLowerCase()); const c=n=>H.indexOf(n);
  const iD=c('date'),iN=c('workout name'),iDur=c('duration'),iE=c('exercise name'),iS=c('set order'),iW=c('weight'),iR=c('reps'),iU=c('weight unit'),iWN=c('workout notes');
  if(iD<0||iE<0||iW<0||iR<0) throw new Error('Keine Strong-CSV: Spalten Date, Exercise Name, Weight und Reps fehlen.');
  const groups=new Map();
  for(const r of rows.slice(1)){
    const so=(r[iS]||'').trim(); if(/rest/i.test(so)) continue;
    const reps=parseNum(r[iR]); if(!(reps>0)) continue;
    let kg=parseNum(r[iW])||0; if(iU>=0&&/lb/i.test(r[iU]||'')) kg=Math.round(kg*0.45359237*10)/10;
    const key=(r[iD]||'')+'|'+(iN>=0?r[iN]:''); let g=groups.get(key);
    if(!g){ g={date:r[iD],name:(iN>=0&&r[iN])||'Training',dur:iDur>=0?r[iDur]:'',notes:iWN>=0?r[iWN]||'':'',ex:new Map()}; groups.set(key,g); }
    const ex=mapExercise(r[iE]); let b=g.ex.get(ex); if(!b){ const e=getEx(ex); b={ex,repMin:e.repMin,repMax:e.repMax,notes:'',sets:[]}; g.ex.set(ex,b); }
    const set={kg,reps,done:true}; if(/^w/i.test(so)) set.warm=true; b.sets.push(set);

    const tp=S.meta.templates.find(t=>norm(t.name)===norm(g.name));
    S.workouts[id]={id,kind:'workout',name:g.name,templateId:tp?tp.id:null,start,end:start+(parseDur(g.dur)||3600000),notes:g.notes,source:'strong',exercises:[...g.ex.values()]};

}
function exportJSON(){ return JSON.stringify({app:'satzbau',version:1,appVersion:APP_VERSION,exportedAt:new Date().toISOString(),meta:S.meta,workouts:finished()},null,1); }
function exportCSV(){
  const q=v=>{ v=String(v??''); return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=['Datum;Uhrzeit;Training;Übung;Satz;kg;Wdh;Dauer_min'];
  for(const w of finished().slice().reverse()){ const d=new Date(w.start); const ds=d.toLocaleDateString('de-DE'), ts=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
    for(const b of w.exercises) b.sets.forEach((s,i)=>lines.push([ds,ts,w.name,getEx(b.ex).name,s.warm?'W':i+1,fmt(s.kg),s.reps,Math.round((w.end-w.start)/60000)].map(q).join(';'))); }

  return `<h2>Daten</h2><p>${n} Trainings, ${sets} Sätze gespeichert.</p>
    <div class="panel"><h3 style="margin-top:0">Speicher</h3><dl class="kv">
      <dt>Speicherart</dt><dd>${esc(storeLabel())}</dd>
      <dt>Dauerhaft</dt><dd id="st-pers">wird geprüft …</dd>
      <dt>Belegt</dt><dd id="st-use">wird geprüft …</dd>
      <dt>Letzte Sicherung</dt><dd>${lb?`${dateFmt.format(lb)} (vor ${alt} Tag${alt===1?'':'en'})`:'noch nie'}</dd></dl>
      ${saveErr?`<p class="pr small">Letztes Speichern fehlgeschlagen: ${esc(saveErr.message||saveErr.name||'Fehler')}. Bitte eine Sicherung exportieren.</p>`:''}
      <div class="row" style="margin-top:.7rem"><button class="btn primary" data-a="exp-json">Sicherung (JSON)</button><button class="btn" data-a="file" data-v="json">Sicherung einspielen</button><button class="btn" data-a="exp-csv">Tabelle (CSV für Excel)</button><button class="btn ghost" data-a="persist" id="st-persist" hidden>Dauerhaft anfordern</button></div>
      <p class="small muted">Die Daten liegen nur auf diesem Gerät. Beim Löschen der Browserdaten oder bei einem neuen Handy hilft nur eine Sicherung.</p></div>
    <div class="panel" style="margin-top:.8rem"><h3 style="margin-top:0">Aus Strong übernehmen</h3><p class="small">In Strong: Profil → Einstellungen → Daten exportieren. Die CSV hier auswählen. Übungsnamen werden den Geräten zugeordnet, unbekannte als eigenes Gerät angelegt. Erneuter Import überschreibt statt zu verdoppeln.</p>
    <button class="btn primary" data-a="file" data-v="strong">Strong-CSV wählen</button></div>
    <h3>Trainingsplanung</h3><p class="small muted">Trainingstage (derzeit ${planTage().map(d=>WD[(d+6)%7]).join(', ')||'keine'}) und Trainingsverlauf mit Aufbau- und Erholungsphasen.</p><button class="btn" data-a="planung">Trainingstage und Trainingsverlauf</button>
    <h3>Pause pro Übungsart</h3><p class="small muted">Nach jedem abgehakten Satz startet ein Countdown in dieser Länge. „aus“ schaltet ihn für die Art ab.</p>
    <div class="grid3">${Object.entries(TYP).map(([k,v])=>`<div><label class="f" for="rest-${k}">${v}</label><select class="in" id="rest-${k}" data-mt="${k}">${[0,45,60,75,90,120,150,180,240].map(x=>`<option value="${x}" ${x===restFor(k)?'selected':''}>${x?clock(x*1000)+' min':'aus'}</option>`).join('')}</select></div>`).join('')}</div>
    <h3>Datenschutz</h3><p class="small">${COL?'Deine Trainings liegen privat in der Datenbank dieses Artefakts; Claude kann sie im Chat direkt lesen.':'Satzbau speichert alles nur auf diesem Gerät. Es gibt kein Konto, kein Tracking und keine Werbung; die Schriften kommen vom selben Server wie die App.'} <a href="datenschutz.html">Datenschutzerklärung</a></p>
    <button class="btn danger" data-a="wipe">Alle Daten auf diesem Gerät löschen</button>
    <p class="small muted" style="margin-top:1.2rem">Satzbau ${APP_VERSION}</p>`;
}
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===view.tab?'page':'false'));
  let h=''; if(view.tab==='training') h=view.sub&&view.sub.startsWith('t:')?vTemplate(view.sub.slice(2)):vTraining();
  else if(view.tab==='uebersicht') h=vUebersicht(); else if(view.tab==='verlauf') h=vVerlauf(); else if(view.tab==='uebungen') h=vUebungen(); else h=vDaten();
  $('#view').innerHTML=h; wakeSync(); if(view.tab==='daten') fillStorageInfo();
}

  tick:el=>{ const b=S.active.exercises[+el.dataset.b], s=b.sets[+el.dataset.s];

      if(s.kg==null||!(s.reps>0)){ toast('Gewicht und Wiederholungen eintragen'); return; }
      { const bi=+el.dataset.b, si=+el.dataset.s, c=checkSet(b,si,undefined,undefined,ctxOf(S.active));
        if(c.hard){ toast(c.msg[0]); focusSet(bi,si,/Wiederholung/.test(c.msg[0])?'reps':'kg'); return; }
        if(!c.ok){ askPlaus('Satz prüfen',c.msg).then(ok=>{ closeSheet(); if(ok){ s.ok=s.okR=true; A.tick(el); } else { render(); focusSet(bi,si); } }); return; } }
      s.done=true;
      { const ge=getEx(b.ex), rs=ge.pause!=null?ge.pause:restFor(ge.typ); if(rs) startRest(rs); }
      if(b.sets[+el.dataset.s+1]&&b.sets[+el.dataset.s+1].kg==null) b.sets[+el.dataset.s+1].kg=s.kg;

  'blk-add':()=>pickExercise(id=>{ S.active.exercises.push(newBlock(id,undefined,undefined,undefined,S.active.phase||null)); saveLocalNow(); closeSheet(); render(); }),

  'body-quick':()=>{ const t=bodyTrend(), td=todayStr(); openSheet(`<h2>Körpergewicht</h2><div class="grid2"><div><label class="f" for="qk">Gewicht (kg)</label><input class="in" id="qk" inputmode="decimal" placeholder="${t?esc(fmt(t.last.kg)):'z. B. 82,4'}"></div><div><label class="f" for="qd">Datum</label><input class="in" id="qd" type="date" value="${td}" max="${td}"></div></div><div class="row" style="margin-top:1rem"><button class="btn primary" data-a="body-save" data-src="sheet">Eintragen</button><button class="btn" data-a="close">Abbrechen</button></div>`); },

  'kg-step':el=>{ const bi=el.dataset.b, b=S.active.exercises[+bi], si=+el.dataset.s, s=b.sets[si]; const st=getEx(b.ex).schritt||2.5, dir=+el.dataset.d;
    const p=prevSet(b.ex,si), old=s.kg, sg=suggest(b.ex,b.repMax,S.active.phase||null), base=old!=null?old:(isErh(S.active)&&sg.kg!=null?sg.kg:(p?p.kg:(sg.kg||0)));

function curTpl(){ return view.sub&&view.sub.startsWith('t:')?S.meta.templates.find(t=>t.id===view.sub.slice(2)):null; }
document.addEventListener('click',ev=>{ const el=ev.target.closest('[data-a]'); if(!el) return; const f=A[el.dataset.a]; if(f){ ev.preventDefault(); f(el,ev); } });
$('#sheet').addEventListener('click',ev=>{ if(ev.target.id==='sheet'){ if(sheetCb.ask) sheetCb.ask(false); closeSheet(); } });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&!$('#sheet').hidden){ if(sheetCb.ask) sheetCb.ask(false); closeSheet(); } });
document.addEventListener('input',ev=>{ const t=ev.target, d=t.dataset;
  if(d.f&&S.active){ if(d.f==='kg'||d.f==='reps'){ const s=S.active.exercises[+d.b].sets[+d.s]; const v=parseNum(t.value); s[d.f]=v==null?v:d.f==='reps'?Math.round(v):Math.round(v*100)/100; delete s[d.f==='kg'?'ok':'okR']; }
    else if(d.f==='wname') S.active.name=t.value; else if(d.f==='wnotes') S.active.notes=t.value; else if(d.f==='bnotes') S.active.exercises[+d.b].notes=t.value; saveLocal(); return; }
  if(d.ef&&ED){ const f=d.ef;
    if(f==='kg'||f==='reps'){ const s=ED.exercises[+d.b]&&ED.exercises[+d.b].sets[+d.s]; if(!s) return; const v=parseNum(t.value);
      if(f==='kg'){ s.rk=t.value; s.kg=v==null?null:Math.round(v*100)/100; s.ok=false; } else { s.rr=t.value; s.reps=v==null?null:Math.round(v); s.okR=false; }
      t.classList.toggle('bad',!!badCls(s,f)); }
    else if(f==='bnotes'){ const b=ED.exercises[+d.b]; if(b) b.notes=t.value; } else ED[f]=t.value;
    return; }
  if(d.xf){ let v=t.value; const id=d.id;
    if(['schritt','repMin','repMax'].includes(d.xf)){ v=parseNum(v.trim()); if(v==null) return; }
    else if(d.xf==='name'){ v=v.replace(/\s+/g,' ').trim(); if(!v){ if(getEx(id).custom) return; v=undefined; } const ti=$('#ex-title'); if(ti) ti.textContent=v||(CAT[id]?CAT[id].name:id); }
    else if(d.xf==='notiz') v=v.trim()||undefined; else v=v.trim();
    setExMeta(id,{[d.xf]:v}); if(d.xf==='group') render(); return; }
  if(d.tf){ const tp=curTpl(); if(!tp) return; tp[d.tf]=d.tf==='kurz'?t.value.trim().slice(0,3):t.value; metaChanged(); return; }
  if(d.tif){ const v=parseNum(t.value); if(v==null) return; curTpl().items[+d.i][d.tif]=Math.max(1,Math.round(v)); metaChanged(); return; }
});
document.addEventListener('focusin',ev=>{ const t=ev.target; if(t.classList&&t.classList.contains('num-in')){ t.dataset.prev=t.value; try{ t.select(); }catch(e){}
  const keep=e=>{ e.preventDefault(); t.removeEventListener('mouseup',keep); }; t.addEventListener('mouseup',keep); setTimeout(()=>t.removeEventListener('mouseup',keep),600); } });
document.addEventListener('change',ev=>{ const t=ev.target, d=t.dataset;
  if(S.active&&(d.f==='kg'||d.f==='reps')&&d.b!=null){ const bi=+d.b, si=+d.s, b=S.active.exercises[bi], s=b&&b.sets[si]; if(!s) return;
    if(t.value.trim()!==''&&parseNum(t.value)==null){ toast('Zahl eingeben, z. B. 42,5'); t.value=d.prev||''; s[d.f]=parseNum(d.prev); saveLocal(); return; }
    const c=checkSet(b,si,t.value.trim(),d.prev);
    const undo=()=>{ t.value=d.prev||''; const v=parseNum(d.prev); s[d.f]=v==null?null:d.f==='reps'?Math.round(v):v; saveLocal(); };
    if(c.hard){ toast(c.msg[0]); undo(); focusSet(bi,si,d.f); return; }
    if(!c.ok) askPlaus('Eingabe prüfen',c.msg).then(ok=>{ closeSheet(); if(ok){ s.ok=s.okR=true; saveLocal(); } else { undo(); focusSet(bi,si,d.f); } });
    return; } });
document.addEventListener('change',ev=>{ const t=ev.target; if(t.dataset.mt){ S.meta.restTyp=S.meta.restTyp||{}; S.meta.restTyp[t.dataset.mt]=+t.value; metaChanged(); toast(TYP[t.dataset.mt]+': '+(+t.value?'Pause '+clock(+t.value*1000)+' min':'Timer aus')); } });
document.addEventListener('change',ev=>{ const t=ev.target, d=t.dataset; if(!d.zf&&!d.zp) return; const z=S.meta.zyklus;
  if(d.zf==='start'){ if(!isDay(t.value)){ toast('Datum wählen'); render(); return; } z.start=t.value; z.anker=z.anker.filter(a=>a.ab>z.start); }
  else if(d.zf==='wiederholen') z.wiederholen=t.checked;
  else if(d.zp){ const x=z.phasen[+d.i]; if(!x) return; const v=t.value, num=parseNum(v);
    if(d.zp==='name') x.name=v.trim().slice(0,30)||(x.typ==='erholung'?'Erholung':'Aufbau');
    else if(d.zp==='typ'){ const e=v==='erholung', std=x.name==='Aufbau'||x.name==='Erholung'; x.typ=e?'erholung':'aufbau'; x.gewichtFaktor=e?0.7:1; x.saetzeFaktor=e?0.5:1; if(std) x.name=e?'Erholung':'Aufbau'; if(e&&x.wochen>2) x.wochen=1; }
    else if(d.zp==='wochen') x.wochen=Math.round(clampN(num,1,12,x.wochen));
    else if(d.zp==='gw') x.gewichtFaktor=clampN(num==null?null:num/100,0.3,1,x.gewichtFaktor);
    else if(d.zp==='sf') x.saetzeFaktor=clampN(num==null?null:num/100,0.2,1,x.saetzeFaktor); }
  S.meta.zyklus=normZyklus(z); metaChanged(); render(); });
$('#file').addEventListener('change',async ev=>{ const f=ev.target.files[0]; if(!f) return;
  try{ const text=await f.text(); let n;
    if(pendingFile==='json'||/\.json$/i.test(f.name)) n=importJSON(text); else n=importStrong(text);
    saveLocalNow(); render(); { const bad=badSets(); toast(`${n} Trainings übernommen`+(bad?` · ${bad} unplausible Sätze (⚠ im Verlauf, werden nicht ausgewertet)`:'')); } importing=true; await push(); }
  catch(e){ toast(e.message||'Datei nicht lesbar'); } finally{ importing=false; render(); } });

/* Bildschirm bleibt im laufenden Training an (Wake Lock, wo vom Browser erlaubt) */
let wl=null;
async function wakeSync(){ try{ if(!('wakeLock' in navigator)) return;
  if(S.active&&!document.hidden){ if(!wl){ const l=await navigator.wakeLock.request('screen'); wl=l; l.addEventListener('release',()=>{ if(wl===l) wl=null; }); } }
  else if(wl){ const l=wl; wl=null; await l.release(); } }catch(e){ wl=null; } }
document.addEventListener('visibilitychange',wakeSync);

/* ---------- Start ---------- */
const PLAN=(id,name,ex)=>({id,name,items:ex.map(e=>({ex:e,sets:3,repMin:8,repMax:12}))});
const DEFAULT_META={kind:'meta',restSec:90,exercises:{schraegbank:{geraetNr:'A12'}},templates:[
  PLAN('plan-a','Plan A',['beinpresse','bankdruecken','pullover','latzug_breit','seitheben_kh','trizeps_kabel','bizeps_kh']),
  PLAN('plan-b','Plan B',['beinpresse','beinbeuger_liegend','schraegbank','rudern','schulterpresse','trizeps_kabel','bizeps_kh'])]};
try{ localStorage.setItem('kb-test','1'); lsOk=localStorage.getItem('kb-test')==='1'; localStorage.removeItem('kb-test'); }catch(e){ lsOk=false; }
(async()=>{
  await loadState();
  if(!S.meta.templates.length&&!Object.keys(S.workouts).length) S.meta=normMeta(clone(DEFAULT_META));
  const farben=ensurePlanColors();
  booted=true;
  if(farben) metaChanged(); else if(needSave) saveLocalNow();
  if(store==='none'){ const b=document.createElement('div'); b.setAttribute('role','alert'); b.style.cssText='background:var(--accent);color:#fff;padding:.6rem 1rem;font-size:.9rem';
    b.textContent='Dieser Browser speichert nichts dauerhaft (privater Modus?). Trainings gehen beim Schließen verloren. Bitte regelmäßig unter „Daten“ eine Sicherung exportieren.'; document.body.insertBefore(b,document.querySelector('main')); }
  const tok=(location.hash||'').slice(1); if(['training','uebersicht','verlauf','uebungen','daten'].includes(tok)) view.tab=tok;
  render();
  if(migrated) toast('Daten in die Browser-Datenbank übernommen');
  initCloud();
})();
/* Offline-Fähigkeit und dauerhafter Speicher (nur über http/https, nicht über file://) */
if(/^https?:$/.test(location.protocol)){
  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}
</script>
